name: gameware
description: Gameware — NOTA Games motion sensor player
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0
  provider: ^6.1.5
  shared_preferences: ^2.2.2
  http: ^1.4.0
  font_awesome_flutter: ^10.8.0
  permission_handler: ^12.0.1
  sensors_plus: ^6.1.1
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Grift
      fonts:
        - asset: assets/fonts/Grift-Regular.ttf
          weight: 400
        - asset: assets/fonts/Grift-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Grift-Bold.ttf
          weight: 700
        - asset: assets/fonts/Grift-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Foun
      fonts:
        - asset: assets/fonts/Foun.ttf
          weight: 400
