plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android" version "2.1.0"
    id 'kotlin-parcelize'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.notathletes"
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Matches iOS bundle IDs: com.notathletes.client / .coach / .client.unlisted / .coach.unlisted
        applicationId "com.notathletes.client"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    flavorDimensions "app"
    productFlavors {
        coach {
            dimension "app"
            applicationId "com.notathletes.coach"
            resValue "string", "app_name", "Not Athletes Coach"
        }
        client {
            dimension "app"
            resValue "string", "app_name", "Not Athletes Train"
        }
        clientUnlisted {
            dimension "app"
            applicationId "com.notathletes.client.unlisted"
            resValue "string", "app_name", "Trainware"
        }
        coachUnlisted {
            dimension "app"
            applicationId "com.notathletes.coach.unlisted"
            resValue "string", "app_name", "Trainware Coach"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    //classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
